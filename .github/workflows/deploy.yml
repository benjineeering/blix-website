name: Deploy website

on:
  # every change on main (including edits saved in the /admin editor)
  push:
    branches: [main]
  # once a day, so finished events move from "Coming up" to the archive
  schedule:
    - cron: '15 2 * * *'
  # manual "Run workflow" button in the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run build
        env:
          # e.g. https://<user>.github.io + /blix-website, or the custom domain + ""
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
